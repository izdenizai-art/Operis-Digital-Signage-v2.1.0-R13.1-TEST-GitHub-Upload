name: YAY Pi Universal Verify

on:
  push:
    branches: [yay-pi-universal-build-v2]
    paths:
      - 'yay-pi-ci/**'
      - '.github/workflows/yay-pi-universal-verify.yml'

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat yay-pi-ci/source.b64.000 yay-pi-ci/source.b64.001 yay-pi-ci/source.b64.002 | base64 -d > /tmp/yay-pi-universal-source.tar.gz
          gzip -t /tmp/yay-pi-universal-source.tar.gz
          expected=$(awk '{print $1}' yay-pi-ci/source.sha256)
          actual=$(sha256sum /tmp/yay-pi-universal-source.tar.gz | awk '{print $1}')
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"
          mkdir -p /tmp/yay-src
          tar -xzf /tmp/yay-pi-universal-source.tar.gz -C /tmp/yay-src
          find /tmp/yay-src -maxdepth 4 -type f -printf '%P\n' | sort
      - name: Run Python tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/yay-src
          python3 -m pip install --disable-pip-version-check -q pytest requests cryptography
          python3 -m pytest -q
      - name: Run Node tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/yay-src
          node --test tests/renderer_test.mjs
      - name: Compile Python source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/yay-src
          python3 -m compileall -q yay
