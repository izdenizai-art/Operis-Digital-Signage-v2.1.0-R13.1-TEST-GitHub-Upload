name: YAY Pi Universal Verify

on:
  push:
    branches: [yay-pi-universal-build-v2]
    paths:
      - 'yay-pi-ci/**'
      - '.github/workflows/yay-pi-universal-verify.yml'

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          parts = sorted(Path('yay-pi-ci').glob('source.b64.*'))
          raw = b''.join(p.read_bytes() for p in parts)
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          print('parts=', [p.name for p in parts])
          print('raw_len=', len(raw), 'clean_len=', len(clean), 'mod4=', len(clean) % 4)
          clean += b'=' * ((4 - len(clean) % 4) % 4)
          data = base64.b64decode(clean, validate=False)
          Path('/tmp/yay-pi-source.tar.gz').write_bytes(data)
          print('decoded_len=', len(data), 'head=', data[:8].hex(), 'tail=', data[-8:].hex())
          PY
          gzip -t /tmp/yay-pi-source.tar.gz
          mkdir -p /tmp/yay-src
          tar -xzf /tmp/yay-pi-source.tar.gz -C /tmp/yay-src
          echo '=== SOURCE TREE ==='
          find /tmp/yay-src -maxdepth 4 -type f -printf '%P\n' | sort
          echo '=== ARCHIVE SHA256 ==='
          sha256sum /tmp/yay-pi-source.tar.gz
      - name: Run Python tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/yay-src
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python3 -m pip install --disable-pip-version-check -q pytest requests
            python3 -m pytest -q
          else
            echo 'No Python tests found'
          fi
      - name: Run Node tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/yay-src
          mapfile -t tests < <(find . -type f -path '*/tests/*.mjs' | sort)
          if [ ${#tests[@]} -gt 0 ]; then
            node --test "${tests[@]}"
          else
            echo 'No Node .mjs tests found'
          fi
      - name: Compile Python source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/yay-src
          python3 -m compileall -q .
