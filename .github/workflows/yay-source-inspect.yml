name: YAY Source Inspect

on:
  push:
    branches: [yay-pi-universal-build-v2]
    paths:
      - '.github/workflows/yay-source-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source and prove regressions fail before fixes
        shell: bash
        run: |
          set -euo pipefail
          cat yay-pi-ci/source.b64.000 yay-pi-ci/source.b64.001 yay-pi-ci/source.b64.002 | base64 -d > /tmp/yay-source.tar.gz
          rm -rf /tmp/yay-src
          mkdir -p /tmp/yay-src
          tar -xzf /tmp/yay-source.tar.gz -C /tmp/yay-src
          cp yay-pi-ci/regression/test_final_image_regressions.py /tmp/yay-src/tests/test_final_image_regressions.py
          cd /tmp/yay-src
          python3 -m pip install --disable-pip-version-check -q pytest
          if python3 -m pytest -q tests/test_final_image_regressions.py; then
            echo 'Regression tests unexpectedly passed before fixes' >&2
            exit 1
          fi
          echo 'Regression failures reproduced as expected.'
