plugins { id 'com.android.application' }

def releaseKeystoreFile = System.getenv('OPERIS_KEYSTORE_FILE')
def releaseKeystorePassword = System.getenv('OPERIS_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('OPERIS_KEY_ALIAS')
def releaseKeyPassword = System.getenv('OPERIS_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystoreFile && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'tr.izdeniz.signage'
    compileSdk 35

    defaultConfig {
        applicationId 'tr.izdeniz.signage'
        minSdk 30
        targetSdk 35
        versionCode 20103
        versionName '2.1.0-r13.1-test'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
